name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check
        run: |
          node --check scripts/probe.mjs
          node --check scripts/new-report.mjs
          bash -n scripts/install.sh

      - name: Report scaffold smoke test
        run: |
          node scripts/new-report.mjs --topic "ci smoke" --tools exa --query "ci" --out /tmp/rk-ci
          test -n "$(ls /tmp/rk-ci/*.md)"
          grep -q '^# 汇总' /tmp/rk-ci/*.md

      - name: Probe runs and emits valid JSON
        run: |
          node scripts/probe.mjs > /tmp/probe.json
          node -e "const r=require('/tmp/probe.json'); if(!r.tools||!r.recommended) process.exit(1); console.log('probe ok')"
